<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#111827" />
  <rect y="470" width="1280" height="250" fill="#1F2937" />
  <rect x="120" y="150" width="240" height="160" fill="#374151" />
  <rect x="900" y="180" width="200" height="140" fill="#374151" />
  <rect x="520" y="200" width="240" height="270" fill="#4B5563" />

  <!-- 判定线 -->
  <line x1="640" y1="90" x2="640" y2="700" stroke="#FACC15" stroke-width="4" stroke-dasharray="18 14" />
  <text x="660" y="120" fill="#FACC15" font-family="sans-serif" font-size="26">判定线</text>

  <!-- 检测到的人体 -->
  <rect x="300" y="330" width="130" height="300" fill="none" stroke="#22C55E" stroke-width="5" />
  <text x="300" y="318" fill="#22C55E" font-family="sans-serif" font-size="26">person 0.92</text>
  <rect x="760" y="370" width="120" height="260" fill="none" stroke="#22C55E" stroke-width="5" />
  <text x="760" y="358" fill="#22C55E" font-family="sans-serif" font-size="26">person 0.87</text>

  <text x="40" y="686" fill="#9CA3AF" font-family="sans-serif" font-size="28">示例画面：静态标注图，仅用于开发布局</text>
</svg>
